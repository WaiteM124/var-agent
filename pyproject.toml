[project]
name = "var-agent"
version = "0.2.0"
description = "LangGraph agent and deterministic VaR tools for a synthetic energy-trading book."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Miles Waite" }]
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff==0.17.6",
  "matplotlib>=3.8",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0",
  "pre-commit>=4.0.0",
]
app = [
  "openai>=1.40.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "azure-search-documents>=11.6.0",
  "azure-core>=1.30.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-dotenv>=1.0.0",
  "streamlit>=1.36.0",
  "requests>=2.32.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "streamlit_app"]

[tool.setuptools.packages.find]
include = ["agent*", "risk*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = [".", "risk", "tests", "examples", "agent"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
